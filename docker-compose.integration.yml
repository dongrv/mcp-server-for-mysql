services:
  mysql-orders:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: orders_test
      MYSQL_USER: orders_test
      MYSQL_PASSWORD: orders_test
      MYSQL_ROOT_PASSWORD: root_test
    ports:
      - "13306:3306"
    volumes:
      - mysql-orders-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mysql-logs:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: logs_test
      MYSQL_USER: logs_test
      MYSQL_PASSWORD: logs_test
      MYSQL_ROOT_PASSWORD: root_test
    ports:
      - "23306:3306"
    volumes:
      - mysql-logs-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: mcp_test
      CLICKHOUSE_USER: mcp
      CLICKHOUSE_PASSWORD: mcp
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "18123:8123"
      - "19000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql-orders-data:
  mysql-logs-data:
